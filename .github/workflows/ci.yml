name: Offline package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Configure APPROVED_CLI_REF to an independently reviewed immutable SHA.
      # Missing approval fails closed, rather than resolving an index collision.
      - name: Require approved CLI commit
        env:
          CLI_REF: ${{ vars.APPROVED_CLI_REF }}
        run: python -c "import os,re; assert re.fullmatch(r'[0-9a-f]{40}', os.environ['CLI_REF']), 'Set APPROVED_CLI_REF to the reviewed public CLI commit SHA'"
      - uses: actions/checkout@v4
        with:
          repository: Pachecodes/pictureme-cli-public
          ref: ${{ vars.APPROVED_CLI_REF }}
          path: approved-cli
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest
      - run: python -m build --outdir approved-wheelhouse approved-cli
      - run: python -m pip install approved-wheelhouse/pictureme_cli-*.whl
      - run: python -m pip install '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m build
      # No dependency re-resolution/replacement during reinstall.
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
